<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker TSA — Profil prestataire</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <button type="button" class="back-btn" onclick="history.back()" aria-label="Retour">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 5l-7 7 7 7" stroke="#7A1027" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="cover-banner"><img src="cover.jpg" alt="" onerror="this.remove()"></div>

  <main class="provider-shell">
    <div class="provider-wrap">

      <div class="role-intro">
        <h1 data-i18n="providerHeadline">Complétez votre profil professionnel</h1>
        <p data-i18n="providerSubtext">Ces informations sont visibles par les clients qui cherchent vos services.</p>
      </div>

      <form id="providerProfileForm" novalidate>

        <!-- Genre : widget Homme / Femme (pas de photo personnelle) -->
        <div class="provider-section">
          <label class="provider-section-label" data-i18n="providerGenderLabel">Vous êtes</label>
          <div class="gender-grid">
            <button type="button" class="gender-card" data-gender="homme" aria-pressed="false">
              <span class="gender-avatar"><svg viewBox="0 0 64 64" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="32" cy="23" r="10"/><path d="M11 58c0-12 9-19 21-19s21 7 21 19z"/></svg></span>
              <span class="gender-name" data-i18n="genderMale">Homme</span>
            </button>
            <button type="button" class="gender-card" data-gender="femme" aria-pressed="false">
              <span class="gender-avatar"><svg viewBox="0 0 64 64" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path opacity=".55" d="M19 27c0-10 5-18 13-18s13 8 13 18v15c0 2-2 3-4 2l-2-1V33H25v11l-2 1c-2 1-4 0-4-2z"/><circle cx="32" cy="24" r="9.5"/><path d="M11 58c0-12 9-19 21-19s21 7 21 19z"/></svg></span>
              <span class="gender-name" data-i18n="genderFemale">Femme</span>
            </button>
          </div>
          <span class="field-error" id="genderError"></span>
        </div>

        <!-- Identité -->
        <div class="provider-row">
          <div class="field" id="providerFirstNameField">
            <label for="providerFirstName" data-i18n="providerFirstName">Prénom</label>
            <input type="text" id="providerFirstName" autocomplete="given-name">
            <span class="field-error"></span>
          </div>
          <div class="field" id="providerLastNameField">
            <label for="providerLastName" data-i18n="providerLastName">Nom</label>
            <input type="text" id="providerLastName" autocomplete="family-name">
            <span class="field-error"></span>
          </div>
        </div>

        <!-- Coordonnées avec widgets cliquables -->
        <div class="field" id="providerPhoneField">
          <label for="providerPhone" data-i18n="providerPhone">Numéro de téléphone</label>
          <div class="phone-field">
            <span class="phone-prefix">+228</span>
            <input type="tel" id="providerPhone" inputmode="numeric" maxlength="8" placeholder="90 00 00 00">
            <button type="button" class="input-action-btn input-action-call" id="callActionBtn" aria-label="Appeler">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L14 13l5 2v3a2 2 0 0 1-2 2C10.5 20 4 13.5 4 6a2 2 0 0 1 1-2z" fill="#fff"/></svg>
            </button>
          </div>
          <span class="field-error"></span>
        </div>

        <div class="field" id="providerWhatsappField">
          <label for="providerWhatsapp" data-i18n="providerWhatsapp">Numéro WhatsApp</label>
          <div class="phone-field">
            <span class="phone-prefix">+228</span>
            <input type="tel" id="providerWhatsapp" inputmode="numeric" maxlength="8" placeholder="90 00 00 00">
            <button type="button" class="input-action-btn input-action-whatsapp" id="whatsappActionBtn" aria-label="WhatsApp">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2z" fill="#fff"/><path d="M8.7 7.6c.2-.5.6-.5 1-.5h.5c.2 0 .4 0 .6.4l.8 1.7c.1.2.1.4 0 .6l-.6.8c-.1.2-.1.3 0 .5.5 1 1.5 2 2.5 2.5.2.1.3.1.5 0l.8-.6c.2-.1.4-.1.6 0l1.7.8c.3.2.4.4.4.6v.5c0 .4 0 .8-.5 1-.5.2-2 .6-3.6-.4-1.8-1.1-3.5-2.8-4.6-4.6-1-1.6-.6-3.1-.4-3.6z" fill="#25D366"/></svg>
            </button>
          </div>
          <span class="field-error"></span>
        </div>

        <div class="field" id="providerEmailField">
          <label for="providerEmail" data-i18n="providerEmail">E-mail</label>
          <input type="email" id="providerEmail" autocomplete="email">
          <span class="field-error"></span>
        </div>

        <!-- Description -->
        <div class="field">
          <label for="providerDescription" data-i18n="providerDescriptionLabel">Description</label>
          <textarea id="providerDescription" rows="4" placeholder="Présentez votre activité, votre expérience, vos services..." data-i18n-placeholder="providerDescriptionPlaceholder"></textarea>
        </div>

        <!-- Information importante -->
        <div class="field">
          <label for="providerAnnouncement" data-i18n="providerAnnouncementLabel">Information importante</label>
          <textarea id="providerAnnouncement" rows="3" placeholder="Horaires, conditions, délais ou tout ce que le client doit savoir..." data-i18n-placeholder="providerAnnouncementPlaceholder"></textarea>
        </div>

        <button type="submit" class="btn-pill-primary">
          <span data-i18n="btnSaveContinue">Enregistrer et continuer</span>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

      </form>

    </div>
  </main>

  <script type="module" src="firebase-config.js"></script>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
