<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker TSA — Compléter votre profil</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <button type="button" class="back-btn" onclick="history.back()" aria-label="Retour">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 5l-7 7 7 7" stroke="#7A1027" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <main class="profile-shell">
    <div class="profile-wrap">

      <div class="role-intro">
        <h1 data-i18n="profileHeadline">Complétez votre profil</h1>
        <p data-i18n="profileSubtext">Ces informations sont utilisées par les prestataires pour vous identifier et vous contacter.</p>
      </div>

      <form id="clientProfileForm" novalidate>

        <div class="avatar-picker">
          <button type="button" class="avatar-circle" id="avatarCircle">
            <img id="avatarPreview" alt="" hidden>
            <svg class="avatar-placeholder" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.6"/>
              <path d="M5 19c0-3.3 3.1-5.4 7-5.4s7 2.1 7 5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="avatar-camera">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 8h3l1.2-2h7.6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="12" cy="13.5" r="3.2" stroke="#fff" stroke-width="1.5"/>
              </svg>
            </span>
          </button>
          <input type="file" id="avatarInput" accept="image/*" hidden>
          <p class="avatar-hint" data-i18n="profilePhotoHint">Ajouter une photo de profil</p>
        </div>

        <div class="field" id="firstNameField">
          <label for="firstName" data-i18n="labelFirstName">Prénom</label>
          <input type="text" id="firstName" name="firstName" placeholder="Votre prénom" data-i18n-placeholder="placeholderFirstName" autocomplete="given-name">
          <span class="field-error"></span>
        </div>

        <div class="field" id="lastNameField">
          <label for="lastName" data-i18n="labelLastName">Nom</label>
          <input type="text" id="lastName" name="lastName" placeholder="Votre nom" data-i18n-placeholder="placeholderLastName" autocomplete="family-name">
          <span class="field-error"></span>
        </div>

        <div class="field" id="phoneField">
          <label for="phone" data-i18n="labelPhone">Numéro de téléphone</label>
          <div class="phone-field">
            <span class="phone-prefix">+228</span>
            <input type="tel" id="phone" name="phone" inputmode="numeric" maxlength="8" placeholder="90 00 00 00" autocomplete="tel-national">
          </div>
          <span class="field-error"></span>
        </div>

        <button type="submit" class="btn-primary" data-i18n="btnValidateProfile">Valider mon profil</button>

      </form>

    </div>
  </main>

  <script type="module" src="firebase-config.js"></script>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
