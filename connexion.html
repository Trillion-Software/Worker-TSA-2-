<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker TSA — Connexion ou création de compte</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="lang-switch">
    <button type="button" class="lang-option is-active" data-lang="fr">FR</button>
    <button type="button" class="lang-option" data-lang="en">EN</button>
  </div>

  <main class="dauth-shell">

    <div class="dauth-wave"></div>
    <div class="dauth-pedestal-texture"></div>

    <div class="dauth-header">
      <img src="logo-full.png" alt="Worker TSA" class="dauth-logo">
    </div>

    <div class="dauth-card">

      <h1 class="dauth-heading" id="authHeading" data-i18n="authLoginHeading">Connexion</h1>
      <p class="dauth-subheading" id="authSubheading" data-i18n="authLoginSubheading">Connectez-vous à votre compte pour continuer</p>

      <!-- Formulaire de connexion -->
      <form class="dauth-form is-active" data-form="login" id="loginForm" novalidate>

        <div class="pill-field" id="loginEmailField">
          <span class="pill-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11z" stroke="#fff" stroke-width="1.6"/><path d="M4 6.5l8 6.5 8-6.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <input type="email" id="loginEmail" name="email" placeholder="Adresse e-mail" data-i18n-placeholder="placeholderEmail" autocomplete="email">
          <span class="field-error"></span>
        </div>

        <div class="pill-field" id="loginPasswordField">
          <span class="pill-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="10.5" width="14" height="9" rx="1.6" stroke="#fff" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="#fff" stroke-width="1.6"/></svg>
          </span>
          <input type="password" id="loginPassword" name="password" placeholder="Mot de passe" autocomplete="current-password">
          <button type="button" class="pill-eye" data-target="loginPassword" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" stroke="#fff" stroke-width="1.6"/></svg>
          </button>
          <span class="field-error"></span>
        </div>

        <div class="dauth-row">
          <label class="dauth-checkbox">
            <input type="checkbox" id="rememberMe">
            <span data-i18n="rememberMe">Se souvenir de moi</span>
          </label>
          <a href="#" class="dauth-link" data-i18n="forgotPassword">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn-pill-primary">
          <span data-i18n="btnLogin">Se connecter</span>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <!-- Formulaire de création de compte -->
      <form class="dauth-form" data-form="signup" id="signupForm" novalidate>

        <div class="pill-field" id="signupNameField">
          <span class="pill-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="3.4" stroke="#fff" stroke-width="1.6"/><path d="M5 19c0-3.3 3.1-5.3 7-5.3s7 2 7 5.3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <input type="text" id="signupName" name="name" placeholder="Nom complet" data-i18n-placeholder="labelName" autocomplete="name">
          <span class="field-error"></span>
        </div>

        <div class="pill-field" id="signupEmailField">
          <span class="pill-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11z" stroke="#fff" stroke-width="1.6"/><path d="M4 6.5l8 6.5 8-6.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <input type="email" id="signupEmail" name="email" placeholder="Adresse e-mail" data-i18n-placeholder="placeholderEmail" autocomplete="email">
          <span class="field-error"></span>
        </div>

        <div class="pill-field" id="signupPasswordField">
          <span class="pill-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="10.5" width="14" height="9" rx="1.6" stroke="#fff" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="#fff" stroke-width="1.6"/></svg>
          </span>
          <input type="password" id="signupPassword" name="password" placeholder="6 caractères minimum" data-i18n-placeholder="placeholderPasswordMin" autocomplete="new-password">
          <button type="button" class="pill-eye" data-target="signupPassword" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" stroke="#fff" stroke-width="1.6"/></svg>
          </button>
          <span class="field-error"></span>
        </div>

        <div class="pill-field" id="signupConfirmField">
          <span class="pill-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="10.5" width="14" height="9" rx="1.6" stroke="#fff" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="#fff" stroke-width="1.6"/></svg>
          </span>
          <input type="password" id="signupConfirm" name="confirm" placeholder="Confirmer le mot de passe" data-i18n-placeholder="labelConfirm" autocomplete="new-password">
          <button type="button" class="pill-eye" data-target="signupConfirm" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" stroke="#fff" stroke-width="1.6"/></svg>
          </button>
          <span class="field-error"></span>
        </div>

        <label class="dauth-checkbox dauth-checkbox-terms">
          <input type="checkbox" id="signupTerms">
          <span data-i18n="termsText">J'accepte les conditions d'utilisation et la politique de confidentialité de Worker TSA.</span>
        </label>

        <button type="submit" class="btn-pill-primary">
          <span data-i18n="btnSignup">Créer mon compte</span>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <div class="dauth-divider"><span data-i18n="orDivider">OU</span></div>

      <button type="button" class="btn-pill-secondary">
        <span class="pill-icon pill-icon-inline">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11z" stroke="#fff" stroke-width="1.6"/><path d="M4 6.5l8 6.5 8-6.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span data-i18n="continueOtherEmail">Continuer avec un autre compte e-mail</span>
      </button>

      <div class="dauth-switch">
        <span class="dauth-switch-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="8" r="3.4" stroke="#fff" stroke-width="1.6"/><path d="M3 19c0-3.3 3.1-5.3 7-5.3 1 0 1.9.13 2.7.37" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M18 9v6M15 12h6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <div class="dauth-switch-text">
          <p id="switchText" data-i18n="switchTextLogin">Vous n'avez pas de compte ?</p>
          <button type="button" data-switch-to="signup" id="switchBtn" data-i18n="switchBtnLogin">Créer un compte</button>
        </div>
        <svg class="dauth-switch-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

    </div>

  </main>

  <script src="i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
