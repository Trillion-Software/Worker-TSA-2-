<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker TSA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="splash-shell" id="splashShell">
    <img src="splash-bg.jpg" alt="Worker TSA" class="splash-bg">
  </main>

  <script>
    // Enchaîne automatiquement vers la page de connexion après le splash (0,5s).
    setTimeout(() => {
      document.getElementById('splashShell').classList.add('is-fading');
    }, 350);

    setTimeout(() => {
      window.location.href = 'connexion.html';
    }, 500);
  </script>
</body>
</html>
