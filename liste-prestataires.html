<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker TSA — Prestataires disponibles</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <button type="button" class="back-btn" onclick="history.back()" aria-label="Retour">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 5l-7 7 7 7" stroke="#7A1027" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <main class="lp-shell">
    <div class="lp-wrap">

      <div class="role-intro">
        <h1 id="lpDomainTitle">Prestataires</h1>
        <p>Contactez directement le prestataire de votre choix.</p>
      </div>

      <div class="lp-list" id="lpList">
        <p class="ca-empty" id="lpEmpty">Chargement...</p>
      </div>

    </div>
  </main>

  <script type="module" src="firebase-config.js"></script>
  <script src="i18n.js"></script>
  <script src="script.js"></script>

</html>
